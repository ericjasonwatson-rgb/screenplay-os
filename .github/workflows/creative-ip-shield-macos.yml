name: Creative IP Shield - macOS XPC validation

on:
  pull_request:
    paths:
      - "SecurityValidation/Native/macOS/**"
      - ".github/workflows/creative-ip-shield-macos.yml"
  push:
    branches:
      - "validation/creative-ip-shield-macos-xpc-20261105"
    paths:
      - "SecurityValidation/Native/macOS/**"
      - ".github/workflows/creative-ip-shield-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xpc-scaffold:
    name: XPC compile and fail-closed contracts (${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    defaults:
      run:
        working-directory: SecurityValidation/Native/macOS
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build macOS-only XPC executable and interfaces
        run: swift build --configuration ${{ matrix.configuration }}
      - name: Validate all fail-closed contract tests
        run: swift test --configuration ${{ matrix.configuration }}
      - name: Verify ad-hoc-signed helper is rejected at startup
        run: |
          python3 Scripts/ad_hoc_negative_smoke.py "$(swift build --show-bin-path --configuration ${{ matrix.configuration }})"
      - name: Verify live launchd XPC peer signature rejection
        run: |
          python3 Scripts/launchd_xpc_probe.py "$(swift build --show-bin-path --configuration ${{ matrix.configuration }})"
      - name: Verify cross-process durable approval claims (synthetic only)
        run: |
          python3 Scripts/cross_process_approval.py "$(swift build --show-bin-path --configuration ${{ matrix.configuration }})"
      - name: Reject unsigned and ad-hoc reviewer app release packages
        run: |
          python3 Scripts/reviewer_bundle_smoke.py "$(swift build --show-bin-path --configuration ${{ matrix.configuration }})"
      - name: Assert there is no dispatch path in validation helper
        run: |
          grep -q 'native_integration_pending' Sources/ShieldNativeContract/ShieldNativeContract.swift
          grep -q 'setCodeSigningRequirement' Sources/ShieldMacService/main.swift
          ! grep -E -q '(https?://|URLSession|NSWorkspace\.shared\.open)' Sources/ShieldMacService/main.swift
