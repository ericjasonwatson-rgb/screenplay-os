name: Native Assembly Editor (macOS)

on:
  push:
    branches:
      - feature/native-assembly-editor-20261106
      - feature/native-video-frame-preview-20261106
      - feature/native-video-pts-index-20261106
      - feature/native-pts-preview-integration-20261107
      - feature/native-video-rate-conform-20261107
      - feature/native-video-frame-cache-20261107
  pull_request:
    paths:
      - 'Sources/ScreenplayDomain/NativeAssembly.swift'
      - 'Sources/ScreenplayDomain/NativeVideoPresentationIndex.swift'
      - 'Sources/ScreenplayOSApp/NativeAssembly*.swift'
      - 'Sources/ScreenplayOSApp/NativeVideo*.swift'
      - 'Sources/ScreenplayOSApp/ContentView.swift'
      - 'Tests/ScreenplayEditorTests/NativeAssembly*.swift'
      - 'Tests/ScreenplayEditorTests/NativeVideo*.swift'
      - '.github/workflows/native-assembly-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-assembly:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm macOS Swift toolchain
        run: swift --version
      - name: Compile native application including exporter and UI
        run: swift build --configuration debug --disable-sandbox --product ScreenplayOS
      - name: Run local assembly identity, edit and persistence tests
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter NativeAssembly
      - name: Run paused video frame preview decoding and provenance tests
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVideoFramePreview
      - name: Verify PTS-conformed paused scrub and cache provenance
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVideoConformedPreview
      - name: Validate bounded SHA-scoped frame LRU and cache invalidation
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVerifiedFrameCache
      - name: Verify mixed-source frame-rate and VFR timeline mapping
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVideoRateConform
      - name: Validate rational source timebase and decoded sample PTS inspection
        run: |
          swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVideoPresentationIndex
          swift test --configuration debug --disable-sandbox --no-parallel --filter NativeVideoTimestampProbe
