name: FilmCraft v0.17.1 Synthetic OTIO Roundtrip

on:
  pull_request:
    paths:
      - 'Sources/ScreenplayOSApp/MediaTimelineOTIO.swift'
      - 'Sources/ScreenplayOSApp/ProductionTakeEditorialBridge.swift'
      - 'Tests/ScreenplayEditorTests/ProductionTakeEditorialBridgeTests.swift'
      - 'Scripts/compare_filmcraft_otio.py'
      - 'Scripts/run_filmcraft_roundtrip.py'
      - 'Scripts/test_filmcraft_roundtrip_review.py'
      - 'Scripts/filmcraft_manual_relink_candidates.py'
      - '.github/workflows/filmcraft-pinned-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filmcraft-otio:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate public-safe ScreenplayOS OTIO fixture
        env:
          SCREENPLAYOS_OTIO_CAPTURE_PATH: ${{ runner.temp }}/screenplayos-generated-take.otio
        run: swift test --configuration debug --disable-sandbox --no-parallel --filter ProductionTakeEditorialBridge
      - name: Install official OTIO parser
        run: python3 -m pip install --user --break-system-packages 'opentimelineio==0.18.1'
      - name: Download fixed FilmCraft release and verify published digest
        shell: bash
        run: |
          set -euo pipefail
          version='0.17.1'
          asset="filmcraft-cli-${version}-macos-universal.zip"
          base="https://github.com/storytold/filmcraft/releases/download/v${version}"
          mkdir -p "${RUNNER_TEMP}/filmcraft"
          cd "${RUNNER_TEMP}/filmcraft"
          curl --fail --location --silent --show-error --retry 2 "$base/$asset" --output "$asset"
          curl --fail --location --silent --show-error --retry 2 "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          grep -F "  $asset" SHA256SUMS.txt | shasum --algorithm 256 --check
          unzip -q "$asset" -d unpacked
          path="$(find unpacked -type f -name filmcraft-cli -print -quit)"
          test -n "$path"
          chmod +x "$path"
          echo "FILMCRAFT_CLI=$PWD/$path" >> "$GITHUB_ENV"
          "$PWD/$path" --version
      - name: Test headless FilmCraft import and re-export without project mutation
        env:
          SCREENPLAYOS_OTIO_CAPTURE_PATH: ${{ runner.temp }}/screenplayos-generated-take.otio
        run: |
          python3 Scripts/run_filmcraft_roundtrip.py --filmcraft-cli "$FILMCRAFT_CLI" --input "$SCREENPLAYOS_OTIO_CAPTURE_PATH" --report "${RUNNER_TEMP}/filmcraft-loss-report.json" --candidate-report "${RUNNER_TEMP}/filmcraft-manual-candidates.json"
      - name: Summarize synthetic provenance loss without revealing clip identities
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          path = root / "filmcraft-loss-report.json"
          if not path.is_file():
              print("No synthetic loss report produced.")
          else:
              report = json.loads(path.read_text())
              clips = report.get("returned_clip_diagnostics", [])
              print("FilmCraft compatibility status:", report.get("status", "unknown"))
              print("Original occurrences:", report.get("baseline_occurrences", "?"))
              print("Returned clips:", report.get("returned_clips", "?"))
              print("All original UUID clip names preserved:",
                    report.get("unique_occurrence_names_preserved", False))
              print("Returned clips with FilmCraft namespace:",
                    sum(bool(c.get("has_filmcraft_namespace")) for c in clips))
              print("Returned clips with ScreenplayOS namespace:",
                    sum(bool(c.get("has_screenplayos_namespace")) for c in clips))
              print("Returned clips with safe relative media:",
                    sum(bool(c.get("media_reference_safe")) for c in clips))
              print("Auto-adoption disabled:", report.get("adopted") is False)
          PY
      - name: Preserve synthetic-only provenance-loss diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-v0171-identity-loss-report
          path: |
            ${{ runner.temp }}/filmcraft-loss-report.json
            ${{ runner.temp }}/filmcraft-manual-candidates.json
          if-no-files-found: ignore
          retention-days: 7
