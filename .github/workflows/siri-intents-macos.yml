name: ScreenplayOS Siri Integration

on:
  pull_request:
    paths:
      - 'Sources/ScreenplayOSApp/SiriWorkspaceIntents.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayOSApp.swift'
      - 'Tests/ScreenplayEditorTests/SiriWorkspaceIntentsTests.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayChromeState.swift'
      - '.github/workflows/siri-intents-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siri-workspace:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Compile and run Siri navigation tests
        run: swift test --configuration debug --disable-sandbox --filter SiriWorkspace
