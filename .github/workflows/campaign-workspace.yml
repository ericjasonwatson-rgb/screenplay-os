name: Campaign Workspace

on:
  pull_request:
    paths:
      - 'Sources/ScreenplayDomain/Campaign*.swift'
      - 'Sources/ScreenplayOSApp/Campaign*.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayOSApp.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayViewModel.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayChromeState.swift'
      - 'Tests/ScreenplayEditorTests/Campaign*.swift'
      - '.github/workflows/campaign-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Install regression-test dependency
        run: python3 -m pip install --user --break-system-packages jsonschema
      - name: Full offline regression suite
        env:
          SCREENPLAYOS_BUILD_CONFIGURATION: ${{ matrix.configuration }}
        # AppKit tests share process-global windows and the main actor. Run all
        # tests serially; no tests are filtered and no assertions are relaxed.
        run: ./Scripts/test.sh --no-parallel
      - name: Run downstream smoke checks if the aggregate suite failed
        if: failure()
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          status=0
          swift run --configuration "$CONFIGURATION" --disable-sandbox --skip-build screenplay-self-test || status=1
          swift run --configuration "$CONFIGURATION" --disable-sandbox --skip-build screenplay-inspect Tests/Fixtures/Defenders_of_Cat_Island.open-screenplay.json --json >/dev/null || status=1
          swift run --configuration "$CONFIGURATION" --disable-sandbox --skip-build screenplay-inspect Tests/Fixtures/Minimal.screenplayos.json --json >/dev/null || status=1
          exit "$status"
      - name: Diagnose native failures against full pinned main control
        if: failure()
        timeout-minutes: 15
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          # Read-only control: no branch is changed. Apply only the known Swift
          # expression compiler fix shared with PRs #3/#4 so main can compile.
          git fetch --depth=1 origin f995ee1d2fe383b1159e0fa9dddd9b76f777696b
          baseline="$RUNNER_TEMP/campaign-main-control"
          git worktree add --detach "$baseline" f995ee1d2fe383b1159e0fa9dddd9b76f777696b
          cp Sources/ScreenplayOSApp/ScreenplayChromeState.swift "$baseline/Sources/ScreenplayOSApp/ScreenplayChromeState.swift"
          cd "$baseline"
          swift test --configuration "$CONFIGURATION" --disable-sandbox --no-parallel
