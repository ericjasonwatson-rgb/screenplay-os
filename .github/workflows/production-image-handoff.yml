name: Production Image Handoff

on:
  pull_request:
    paths:
      - 'Sources/ScreenplayDomain/ProductionImagePlanning.swift'
      - 'Sources/ScreenplayDomain/ProductionBoardApproval.swift'
      - 'Sources/ScreenplayDomain/ApprovedProductionImageFlow.swift'
      - 'Sources/ScreenplayDomain/ProductionImageSendGate.swift'
      - 'Sources/ScreenplayDomain/ProductionImageConsentCoordinator.swift'
      - 'Sources/ScreenplayOSApp/OpenAIReferenceImageRequest.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageDispatchPreflight.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageResultPreparation.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageResponseExecution.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageResultVault.swift'
      - 'Sources/ScreenplayOSApp/OpenAIProductionImageTransport.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageJobStagingSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageConsentDecisionSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageSendConfirmationSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImagePendingJobsSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImagePlanningSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageCandidateAdoption.swift'
      - 'Sources/ScreenplayOSApp/ScreenplayViewModel.swift'
      - 'Sources/ScreenplayDomain/ProductionImageTakeHandoff.swift'
      - 'Sources/ScreenplayDomain/ProductionImageJobPlanning.swift'
      - 'Sources/ScreenplayDomain/ProductionImageReferencePreview.swift'
      - 'Sources/ScreenplayOSApp/ProductionImageReviewSheet.swift'
      - 'Sources/ScreenplayOSApp/ProductionImagePlanningSheet.swift'
      - 'Sources/ScreenplayOSApp/ContentView.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImagePlanningTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionBoardApprovalTests.swift'
      - 'Tests/ScreenplayEditorTests/ApprovedProductionImageFlowTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageSendGateTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageConsentCoordinatorTests.swift'
      - 'Tests/ScreenplayEditorTests/OpenAIReferenceImageRequestTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageDispatchPreflightTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageResultPreparationTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageResponseExecutionTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageResultVaultTests.swift'
      - 'Tests/ScreenplayEditorTests/OpenAIProductionImageTransportTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageJobStagingSheetTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageConsentDecisionSheetTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageSendConfirmationSheetTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImagePendingJobsSheetTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageCandidateAdoptionTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageOfflineEndToEndTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageTakeHandoffTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageJobPlanningTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageReferencePreviewTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImageReviewSheetTests.swift'
      - 'Tests/ScreenplayEditorTests/ProductionImagePlanningSheetTests.swift'
      - '.github/workflows/production-image-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-handoff:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test storyboard approval and candidate handoff
        run: swift test --configuration debug --disable-sandbox --filter ProductionImage
